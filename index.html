<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ไทยช่วยไทยพลัส</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    --bg:
        radial-gradient(circle at top left,#ffffff 0%,#f6f7fb 35%,#eef2f7 100%);

    --card:
        rgba(255,255,255,.72);

    --card-solid:
        #ffffff;

    --line:
        rgba(255,255,255,.6);

    --line-soft:
        rgba(0,0,0,.05);

    --text:
        #0f172a;

    --muted:
        #64748b;

    --black:
        #020617;

    --blue:
        #2563eb;

    --purple:
        #7c3aed;

    --green:
        #059669;

    --shadow-xl:
        0 20px 60px rgba(15,23,42,.10);

    --shadow-card:
        0 10px 30px rgba(15,23,42,.06);

    --radius-xl:
        34px;

    --radius-lg:
        28px;

    --radius-md:
        22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    background:var(--bg);

    min-height:100vh;

    color:var(--text);

    overflow-x:hidden;
}

body::before{
    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(circle at 10% 10%,rgba(59,130,246,.12),transparent 30%),
        radial-gradient(circle at 90% 0%,rgba(124,58,237,.10),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(14,165,233,.08),transparent 35%);

    pointer-events:none;

    z-index:-1;
}

.app{
    width:100%;
    max-width:460px;

    margin:auto;

    padding:22px 16px 80px;
}

.hero{
    position:relative;

    padding:28px;

    border-radius:40px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,255,255,.55)
        );

    border:1px solid rgba(255,255,255,.9);

    backdrop-filter:blur(24px);

    -webkit-backdrop-filter:blur(24px);

    box-shadow:var(--shadow-xl);

    overflow:hidden;

    animation:heroEnter .9s cubic-bezier(.22,1,.36,1);
}

.hero::after{
    content:"";

    position:absolute;

    width:240px;
    height:240px;

    right:-120px;
    top:-120px;

    background:
        radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);

    opacity:.7;
}

.badge{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 14px;

    border-radius:999px;

    background:rgba(15,23,42,.92);

    color:white;

    font-size:11px;

    font-weight:700;

    letter-spacing:.08em;

    margin-bottom:20px;

    box-shadow:
        0 8px 24px rgba(15,23,42,.18);
}

.hero h1{
    font-size:38px;

    line-height:1;

    font-weight:800;

    letter-spacing:-0.05em;
}

.hero p{
    margin-top:14px;

    color:var(--muted);

    font-size:15px;

    line-height:1.7;
}

.section{
    margin-top:20px;
}

.grid{
    display:grid;

    gap:14px;
}

.card{
    position:relative;

    padding:22px;

    border-radius:var(--radius-lg);

    background:var(--card);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    border:1px solid var(--line);

    box-shadow:var(--shadow-card);

    overflow:hidden;

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        box-shadow .35s ease,
        border-color .35s ease;
}

.card:hover{
    transform:translateY(-4px);

    box-shadow:
        0 18px 50px rgba(15,23,42,.12);
}

.card::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.5),
            transparent
        );

    pointer-events:none;
}

.label{
    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.12em;

    color:#94a3b8;

    font-weight:700;

    margin-bottom:16px;
}

.stats{
    display:flex;

    justify-content:space-between;

    gap:18px;
}

.stat{
    flex:1;
}

.stat small{
    display:block;

    color:#94a3b8;

    font-size:12px;

    margin-bottom:8px;
}

.stat h2{
    font-size:28px;

    letter-spacing:-0.04em;

    font-weight:800;
}

.stat.blue h2{
    color:var(--blue);
}

.stat.purple h2{
    color:var(--purple);
}

.alert{
    position:relative;

    display:flex;

    gap:14px;

    align-items:flex-start;

    padding:18px;

    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.95),
            rgba(255,255,255,.7)
        );

    border:1px solid rgba(255,255,255,.8);

    box-shadow:var(--shadow-card);

    overflow:hidden;

    animation:fadeSlide .6s ease;
}

.alert-icon{
    width:42px;
    height:42px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f8fafc;

    font-size:18px;

    flex-shrink:0;
}

.alert h4{
    font-size:15px;
    font-weight:700;
}

.alert p{
    margin-top:4px;

    color:var(--muted);

    font-size:13px;

    line-height:1.6;
}

.form-card{
    padding:24px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;

    margin-bottom:10px;

    font-size:12px;

    color:#64748b;

    font-weight:600;
}

.input{
    width:100%;

    border:none;

    padding:16px 18px;

    border-radius:22px;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        inset 0 0 0 1px rgba(15,23,42,.06);

    font-size:15px;

    font-weight:600;

    color:var(--text);

    transition:all .25s ease;
}

.input:focus{
    outline:none;

    transform:translateY(-1px);

    box-shadow:
        inset 0 0 0 2px rgba(37,99,235,.4),
        0 10px 30px rgba(37,99,235,.10);
}

.button{
    width:100%;

    border:none;

    cursor:pointer;

    padding:17px 22px;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            #111827,
            #020617
        );

    color:white;

    font-weight:700;

    font-size:15px;

    letter-spacing:-0.02em;

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    box-shadow:
        0 14px 40px rgba(2,6,23,.25);
}

.button:hover{
    transform:translateY(-2px) scale(1.01);
}

.button:active{
    transform:scale(.98);
}

.history-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:16px;
}

.history-header h3{
    font-size:16px;

    letter-spacing:-0.03em;
}

.clear-btn{
    border:none;

    background:none;

    color:#ef4444;

    font-size:13px;

    font-weight:600;

    cursor:pointer;
}

.history{
    display:flex;

    flex-direction:column;

    gap:12px;
}

.tx{
    position:relative;

    padding:18px;

    border-radius:24px;

    background:
        rgba(255,255,255,.74);

    border:1px solid rgba(255,255,255,.7);

    backdrop-filter:blur(18px);

    box-shadow:
        0 10px 26px rgba(15,23,42,.05);

    transition:all .25s ease;

    animation:fadeUp .45s ease;
}

.tx:hover{
    transform:translateY(-2px);
}

.tx-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;
}

.tx-date{
    font-size:13px;

    font-weight:700;
}

.tx-price{
    font-size:20px;

    font-weight:800;

    letter-spacing:-0.04em;
}

.tx-bottom{
    display:flex;

    justify-content:space-between;

    gap:12px;

    flex-wrap:wrap;
}

.pill{
    padding:8px 12px;

    border-radius:999px;

    font-size:12px;

    font-weight:700;
}

.pill-blue{
    background:rgba(37,99,235,.08);
    color:var(--blue);
}

.pill-green{
    background:rgba(5,150,105,.08);
    color:var(--green);
}

.delete{
    margin-top:14px;

    width:100%;

    border:none;

    background:#fff5f5;

    color:#dc2626;

    padding:12px;

    border-radius:18px;

    font-weight:700;

    cursor:pointer;

    transition:all .2s ease;
}

.delete:hover{
    background:#fee2e2;
}

.empty{
    text-align:center;

    padding:50px 20px;

    color:#94a3b8;

    font-size:14px;
}

@keyframes heroEnter{
    from{
        opacity:0;
        transform:translateY(30px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeSlide{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="app">

    <section class="hero">

        <div class="badge">
            ● SECURE LOCAL STORAGE
        </div>

        <h1>
            ไทยช่วยไทยพลัส
        </h1>

        <p>
            ระบบติดตามสิทธิรัฐช่วยจ่าย 60/40
        </p>

    </section>

    <section class="section grid">

        <div class="card">

            <div class="label">
                สิทธิรายวัน
            </div>

            <div class="stats">

                <div class="stat">
                    <small>ใช้ไปแล้ว</small>
                    <h2 id="daily-used">0</h2>
                </div>

                <div class="stat blue">
                    <small>คงเหลือ</small>
                    <h2 id="daily-remain">200</h2>
                </div>

            </div>

        </div>

        <div class="card">

            <div class="label">
                สิทธิรายเดือน
            </div>

            <div class="stats">

                <div class="stat">
                    <small>ใช้ไปแล้ว</small>
                    <h2 id="monthly-used">0</h2>
                </div>

                <div class="stat purple">
                    <small>คงเหลือ</small>
                    <h2 id="monthly-remain">1000</h2>
                </div>

            </div>

        </div>

    </section>

    <section class="section">

        <div id="smart-alert"></div>

    </section>

    <section class="section">

        <div class="card form-card">

            <div class="field">
                <label>วันที่ซื้อสินค้า</label>
                <input type="date" id="date-input" class="input">
            </div>

            <div class="field">
                <label>ยอดซื้อสินค้า (บาท)</label>
                <input
                    type="number"
                    id="amount-input"
                    class="input"
                    placeholder="เช่น 399"
                >
            </div>

            <button class="button" id="submit-btn">
                + บันทึกรายจ่าย
            </button>

        </div>

    </section>

    <section class="section">

        <div class="history-header">
            <h3>ประวัติรายการ</h3>

            <button class="clear-btn" onclick="clearData()">
                ล้างทั้งหมด
            </button>
        </div>

        <div class="history" id="history-list"></div>

    </section>

</div>

<script>

const GOV_DAILY_LIMIT = 200;
const GOV_MONTHLY_LIMIT = 1000;

document.getElementById('date-input').valueAsDate = new Date();

function getTransactions() {

    const data =
        localStorage.getItem('gov_copay_ultra');

    return data ? JSON.parse(data) : [];
}

function saveTransaction(tx){

    const data = getTransactions();

    data.unshift(tx);

    localStorage.setItem(
        'gov_copay_ultra',
        JSON.stringify(data)
    );
}

function calculateStats(dateStr){

    const data = getTransactions();

    const month =
        dateStr.substring(0,7);

    let daily = 0;
    let monthly = 0;

    data.forEach(tx=>{

        if(tx.date === dateStr){
            daily += tx.govPaid;
        }

        if(tx.date.startsWith(month)){
            monthly += tx.govPaid;
        }
    });

    return{

        dailyUsed:daily,

        dailyRemain:
            Math.max(
                0,
                GOV_DAILY_LIMIT - daily
            ),

        monthlyUsed:monthly,

        monthlyRemain:
            Math.max(
                0,
                GOV_MONTHLY_LIMIT - monthly
            )
    };
}

function renderAlert(stats){

    const box =
        document.getElementById(
            'smart-alert'
        );

    if(stats.monthlyRemain <= 0){

        box.innerHTML = `
            <div class="alert">
                <div class="alert-icon">🛑</div>
                <div>
                    <h4>วงเงินรายเดือนหมดแล้ว</h4>
                    <p>
                        คุณใช้สิทธิรัฐครบ 1,000 บาทแล้ว
                    </p>
                </div>
            </div>
        `;

    }else if(stats.monthlyRemain <= 150){

        box.innerHTML = `
            <div class="alert">
                <div class="alert-icon">⚠️</div>
                <div>
                    <h4>สิทธิรายเดือนใกล้หมด</h4>
                    <p>
                        เหลืออีก
                        ${stats.monthlyRemain.toFixed(2)}
                        บาท
                    </p>
                </div>
            </div>
        `;

    }else if(stats.dailyRemain <= 30){

        box.innerHTML = `
            <div class="alert">
                <div class="alert-icon">🔔</div>
                <div>
                    <h4>สิทธิรายวันใกล้หมด</h4>
                    <p>
                        วันนี้เหลืออีก
                        ${stats.dailyRemain.toFixed(2)}
                        บาท
                    </p>
                </div>
            </div>
        `;

    }else{
        box.innerHTML = '';
    }
}

function renderHistory(){

    const container =
        document.getElementById(
            'history-list'
        );

    const data = getTransactions();

    if(data.length === 0){

        container.innerHTML = `
            <div class="empty">
                ยังไม่มีรายการในระบบ
            </div>
        `;

        return;
    }

    container.innerHTML =
        data.map(tx=>`

        <div class="tx">

            <div class="tx-top">

                <div class="tx-date">
                    📅 ${tx.date}
                </div>

                <div class="tx-price">
                    ฿${tx.amount.toLocaleString()}
                </div>

            </div>

            <div class="tx-bottom">

                <div class="pill pill-blue">
                    รัฐช่วย
                    ฿${tx.govPaid.toFixed(2)}
                </div>

                <div class="pill pill-green">
                    เราจ่าย
                    ฿${tx.userPaid.toFixed(2)}
                </div>

            </div>

            <button
                class="delete"
                onclick="deleteTransaction(${tx.id})"
            >
                ลบรายการ
            </button>

        </div>

    `).join('');
}

function updateUI(){

    const dateStr =
        document.getElementById(
            'date-input'
        ).value;

    const stats =
        calculateStats(dateStr);

    document.getElementById(
        'daily-used'
    ).innerText =
        stats.dailyUsed.toFixed(0);

    document.getElementById(
        'daily-remain'
    ).innerText =
        stats.dailyRemain.toFixed(0);

    document.getElementById(
        'monthly-used'
    ).innerText =
        stats.monthlyUsed.toFixed(0);

    document.getElementById(
        'monthly-remain'
    ).innerText =
        stats.monthlyRemain.toFixed(0);

    renderAlert(stats);

    renderHistory();
}

document.getElementById(
    'submit-btn'
).addEventListener('click',()=>{

    const dateStr =
        document.getElementById(
            'date-input'
        ).value;

    const amount =
        parseFloat(
            document.getElementById(
                'amount-input'
            ).value
        );

    if(!dateStr || !amount || amount <=0){
        return;
    }

    const stats =
        calculateStats(dateStr);

    let gov =
        Math.min(
            amount * .6,
            stats.dailyRemain,
            stats.monthlyRemain
        );

    if(gov < 0){
        gov = 0;
    }

    const tx = {

        id:Date.now(),

        date:dateStr,

        amount:amount,

        govPaid:gov,

        userPaid:amount - gov
    };

    saveTransaction(tx);

    document.getElementById(
        'amount-input'
    ).value = '';

    updateUI();
});

function deleteTransaction(id){

    if(!confirm('ลบรายการนี้ใช่หรือไม่?')){
        return;
    }

    let data = getTransactions();

    data =
        data.filter(tx=>tx.id !== id);

    localStorage.setItem(
        'gov_copay_ultra',
        JSON.stringify(data)
    );

    updateUI();
}

function clearData(){

    if(
        confirm(
            'ล้างข้อมูลทั้งหมดใช่หรือไม่?'
        )
    ){

        localStorage.removeItem(
            'gov_copay_ultra'
        );

        updateUI();
    }
}

document.getElementById(
    'date-input'
).addEventListener(
    'change',
    updateUI
);

updateUI();

</script>

</body>
</html>
