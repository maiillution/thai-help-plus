<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>ไทยช่วยไทยพลัส</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    --bg:
        radial-gradient(circle at top left,#ffffff 0%,#f6f7fb 35%,#eef2f7 100%);

    --card:
        rgba(255,255,255,.72);

    --line:
        rgba(255,255,255,.7);

    --text:
        #0f172a;

    --muted:
        #64748b;

    --blue:
        #2563eb;

    --purple:
        #7c3aed;

    --green:
        #059669;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{

    font-family:
        Inter,
        sans-serif;

    background:var(--bg);

    min-height:100vh;

    color:var(--text);

    overflow-x:hidden;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
        radial-gradient(circle at 10% 10%,rgba(59,130,246,.10),transparent 30%),
        radial-gradient(circle at 90% 0%,rgba(124,58,237,.08),transparent 30%);

    pointer-events:none;

    z-index:-1;
}

.app{

    width:100%;
    max-width:480px;

    margin:auto;

    padding:20px 16px 80px;
}

.hero{

    position:relative;

    padding:30px;

    border-radius:40px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.88),
            rgba(255,255,255,.58)
        );

    backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.8);

    box-shadow:
        0 20px 60px rgba(15,23,42,.08);

    overflow:hidden;

    animation:fadeUp .8s ease;
}

.hero::after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    right:-120px;
    top:-120px;

    background:
        radial-gradient(circle,rgba(255,255,255,.8),transparent 70%);
}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:8px 14px;

    border-radius:999px;

    background:#111827;

    color:white;

    font-size:11px;

    font-weight:700;

    margin-bottom:20px;
}

.hero h1{

    font-size:38px;

    font-weight:800;

    letter-spacing:-0.05em;

    line-height:1;
}

.hero p{

    margin-top:14px;

    color:var(--muted);

    font-size:15px;

    line-height:1.7;
}

.top-tabs{

    display:flex;

    gap:8px;

    padding:8px;

    margin-top:18px;

    border-radius:999px;

    background:rgba(255,255,255,.55);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
        0 10px 30px rgba(15,23,42,.06);
}

.tab-btn{

    flex:1;

    border:none;

    background:transparent;

    padding:14px;

    border-radius:999px;

    font-weight:700;

    font-size:13px;

    color:#64748b;

    transition:all .25s ease;

    cursor:pointer;
}

.tab-btn.active{

    background:#111827;

    color:white;

    box-shadow:
        0 8px 20px rgba(17,24,39,.18);
}

.page-tab{

    display:none;
}

.page-tab.active{

    display:block;

    animation:fadeUp .45s ease;
}

.section{

    margin-top:20px;
}

.card{

    padding:22px;

    border-radius:30px;

    background:var(--card);

    backdrop-filter:blur(24px);

    border:1px solid var(--line);

    box-shadow:
        0 12px 30px rgba(15,23,42,.05);

    transition:all .25s ease;
}

.card:hover{

    transform:translateY(-2px);
}

.label{

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:.1em;

    color:#94a3b8;

    font-weight:700;

    margin-bottom:16px;
}

.stats{

    display:flex;

    justify-content:space-between;

    gap:16px;
}

.stat{

    flex:1;
}

.stat small{

    display:block;

    color:#94a3b8;

    margin-bottom:8px;

    font-size:12px;
}

.stat h2{

    font-size:28px;

    font-weight:800;

    letter-spacing:-0.05em;
}

.blue{

    color:var(--blue);
}

.purple{

    color:var(--purple);
}

.green{

    color:var(--green);
}

.field{

    margin-bottom:16px;
}

.field label{

    display:block;

    margin-bottom:10px;

    font-size:12px;

    color:#64748b;

    font-weight:700;
}

.input{

    width:100%;

    border:none;

    padding:16px 18px;

    border-radius:22px;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        inset 0 0 0 1px rgba(15,23,42,.06);

    font-size:15px;

    font-weight:600;

    transition:all .25s ease;
}

.input:focus{

    outline:none;

    transform:translateY(-1px);

    box-shadow:
        inset 0 0 0 2px rgba(37,99,235,.35),
        0 10px 30px rgba(37,99,235,.08);
}

.button{

    width:100%;

    border:none;

    cursor:pointer;

    padding:17px;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            #111827,
            #020617
        );

    color:white;

    font-weight:700;

    font-size:15px;

    transition:all .25s ease;

    box-shadow:
        0 14px 30px rgba(2,6,23,.18);
}

.button:hover{

    transform:translateY(-2px);
}

.alert{

    padding:18px;

    border-radius:24px;

    background:
        rgba(255,255,255,.75);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.7);

    font-size:14px;

    line-height:1.6;

    color:#475569;
}

.history{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.tx{

    padding:18px;

    border-radius:24px;

    background:
        rgba(255,255,255,.75);

    border:1px solid rgba(255,255,255,.7);

    backdrop-filter:blur(20px);

    box-shadow:
        0 10px 24px rgba(15,23,42,.04);

    animation:fadeUp .4s ease;
}

.tx-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;
}

.tx-price{

    font-size:20px;

    font-weight:800;
}

.tx-bottom{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.pill{

    padding:8px 12px;

    border-radius:999px;

    font-size:12px;

    font-weight:700;
}

.pill-blue{

    background:rgba(37,99,235,.08);

    color:var(--blue);
}

.pill-green{

    background:rgba(5,150,105,.08);

    color:var(--green);
}

.delete{

    margin-top:14px;

    width:100%;

    border:none;

    padding:12px;

    border-radius:18px;

    background:#fff1f2;

    color:#e11d48;

    font-weight:700;

    cursor:pointer;
}

.calc-result{

    margin-top:18px;

    display:grid;

    gap:12px;
}

.calc-box{

    padding:20px;

    border-radius:24px;

    background:
        rgba(255,255,255,.8);

    border:1px solid rgba(255,255,255,.7);
}

.calc-label{

    font-size:12px;

    color:#94a3b8;

    margin-bottom:10px;

    text-transform:uppercase;

    font-weight:700;
}

.calc-value{

    font-size:34px;

    font-weight:800;

    letter-spacing:-0.05em;
}

.creator{

    text-align:center;

    margin-top:40px;

    color:#94a3b8;

    font-size:12px;
}

.creator span{

    color:#111827;

    font-weight:700;
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(18px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="app">

    <section class="hero">

        <div class="badge">
            ● LOCAL STORAGE SECURED
        </div>

        <h1>
            ไทยช่วยไทยพลัส
        </h1>

        <p>
            ระบบช่วยคำนวณสิทธิรัฐช่วยจ่าย 60/40
            อนุญาติให้ใช้งานฟรีเท่านั้น -ห้ามจำหน่าย-
        </p>

    </section>

    <div class="top-tabs">

        <button class="tab-btn active" onclick="switchTab(event,'dashboard')">
            Dashboard
        </button>

        <button class="tab-btn" onclick="switchTab(event,'calculator')">
            คำนวณก่อนซื้อ
        </button>

    </div>

    <div id="dashboard" class="page-tab active">

        <section class="section">

            <div class="card">

                <div class="label">
                    สิทธิรายวัน
                </div>

                <div class="stats">

                    <div class="stat">
                        <small>ใช้ไปแล้ว</small>
                        <h2 id="daily-used">0</h2>
                    </div>

                    <div class="stat">
                        <small>คงเหลือ</small>
                        <h2 class="blue" id="daily-remain">200</h2>
                    </div>

                </div>

            </div>

        </section>

        <section class="section">

            <div class="card">

                <div class="label">
                    สิทธิรายเดือน
                </div>

                <div class="stats">

                    <div class="stat">
                        <small>ใช้ไปแล้ว</small>
                        <h2 id="monthly-used">0</h2>
                    </div>

                    <div class="stat">
                        <small>คงเหลือ</small>
                        <h2 class="purple" id="monthly-remain">1000</h2>
                    </div>

                </div>

            </div>

        </section>

        <section class="section">

            <div id="smart-alert"></div>

        </section>

        <section class="section">

            <div class="card">

                <div class="field">

                    <label>
                        วันที่ซื้อสินค้า
                    </label>

                    <input
                        type="date"
                        id="date-input"
                        class="input"
                    >

                </div>

                <div class="field">

                    <label>
                        ราคาสินค้า
                    </label>

                    <input
                        type="number"
                        id="amount-input"
                        class="input"
                        placeholder="เช่น 399"
                    >

                </div>

                <button class="button" id="submit-btn">
                    + บันทึกรายจ่าย
                </button>

            </div>

        </section>

        <section class="section">

            <div class="history" id="history-list"></div>

        </section>

    </div>

    <div id="calculator" class="page-tab">

        <section class="section">

            <div class="card">

                <div class="field">

                    <label>
                        ราคาสินค้า
                    </label>

                    <input
                        type="number"
                        id="calc-input"
                        class="input"
                        placeholder="เช่น 399"
                        oninput="calculatePreview()"
                    >

                </div>

                <div class="calc-result">

                    <div class="calc-box">

                        <div class="calc-label">
                            รัฐช่วยจ่าย
                        </div>

                        <div class="calc-value blue" id="gov-preview">
                            ฿0
                        </div>

                    </div>

                    <div class="calc-box">

                        <div class="calc-label">
                            เราจ่ายเอง
                        </div>

                        <div class="calc-value green" id="user-preview">
                            ฿0
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </div>

    <div class="creator">
        Crafted with precision by
        <span>PreechaPEA</span>
    </div>

</div>

<script>

const GOV_DAILY_LIMIT = 200;
const GOV_MONTHLY_LIMIT = 1000;

document.getElementById('date-input').valueAsDate = new Date();

function getTransactions(){

    const data =
        localStorage.getItem(
            'gov_copay_ultra'
        );

    return data
        ? JSON.parse(data)
        : [];
}

function saveTransaction(tx){

    const data =
        getTransactions();

    data.unshift(tx);

    localStorage.setItem(
        'gov_copay_ultra',
        JSON.stringify(data)
    );
}

function calculateStats(dateStr){

    const data =
        getTransactions();

    const month =
        dateStr.substring(0,7);

    let daily = 0;
    let monthly = 0;

    data.forEach(tx=>{

        if(tx.date === dateStr){

            daily += tx.govPaid;
        }

        if(tx.date.startsWith(month)){

            monthly += tx.govPaid;
        }
    });

    return{

        dailyUsed:daily,

        dailyRemain:
            Math.max(
                0,
                GOV_DAILY_LIMIT - daily
            ),

        monthlyUsed:monthly,

        monthlyRemain:
            Math.max(
                0,
                GOV_MONTHLY_LIMIT - monthly
            )
    };
}

function renderAlert(stats){

    const box =
        document.getElementById(
            'smart-alert'
        );

    if(stats.monthlyRemain <= 0){

        box.innerHTML = `
            <div class="alert">
                🛑 คุณใช้สิทธิรายเดือนครบแล้ว
            </div>
        `;

    }else if(stats.monthlyRemain <= 150){

        box.innerHTML = `
            <div class="alert">
                ⚠️ สิทธิรายเดือนใกล้หมด
                เหลืออีก
                ${stats.monthlyRemain.toFixed(2)}
                บาท
            </div>
        `;

    }else{

        box.innerHTML = '';
    }
}

function renderHistory(){

    const container =
        document.getElementById(
            'history-list'
        );

    const data =
        getTransactions();

    if(data.length === 0){

        container.innerHTML = `
            <div class="alert">
                ยังไม่มีรายการในระบบ
            </div>
        `;

        return;
    }

    container.innerHTML =
        data.map(tx=>`

        <div class="tx">

            <div class="tx-top">

                <div>
                    📅 ${tx.date}
                </div>

                <div class="tx-price">
                    ฿${tx.amount.toFixed(2)}
                </div>

            </div>

            <div class="tx-bottom">

                <div class="pill pill-blue">
                    รัฐช่วย ฿${tx.govPaid.toFixed(2)}
                </div>

                <div class="pill pill-green">
                    เราจ่าย ฿${tx.userPaid.toFixed(2)}
                </div>

            </div>

            <button
                class="delete"
                onclick="deleteTransaction(${tx.id})"
            >
                ลบรายการ
            </button>

        </div>

    `).join('');
}

function updateUI(){

    const dateStr =
        document.getElementById(
            'date-input'
        ).value;

    const stats =
        calculateStats(dateStr);

    document.getElementById(
        'daily-used'
    ).innerText =
        stats.dailyUsed.toFixed(0);

    document.getElementById(
        'daily-remain'
    ).innerText =
        stats.dailyRemain.toFixed(0);

    document.getElementById(
        'monthly-used'
    ).innerText =
        stats.monthlyUsed.toFixed(0);

    document.getElementById(
        'monthly-remain'
    ).innerText =
        stats.monthlyRemain.toFixed(0);

    renderAlert(stats);

    renderHistory();
}

function switchTab(event,tab){

    document
        .querySelectorAll('.page-tab')
        .forEach(el=>{

            el.classList.remove('active');
        });

    document
        .querySelectorAll('.tab-btn')
        .forEach(el=>{

            el.classList.remove('active');
        });

    document
        .getElementById(tab)
        .classList.add('active');

    event.target.classList.add('active');
}

function calculatePreview(){

    const amount =
        parseFloat(
            document.getElementById(
                'calc-input'
            ).value
        ) || 0;

    const dateStr =
        document.getElementById(
            'date-input'
        ).value;

    const stats =
        calculateStats(dateStr);

    let gov =
        Math.min(
            amount * .6,
            stats.dailyRemain,
            stats.monthlyRemain
        );

    if(gov < 0){

        gov = 0;
    }

    const user =
        amount - gov;

    document.getElementById(
        'gov-preview'
    ).innerText =
        '฿' + gov.toFixed(2);

    document.getElementById(
        'user-preview'
    ).innerText =
        '฿' + user.toFixed(2);
}

document.getElementById(
    'submit-btn'
).addEventListener('click',()=>{

    const dateStr =
        document.getElementById(
            'date-input'
        ).value;

    const amount =
        parseFloat(
            document.getElementById(
                'amount-input'
            ).value
        );

    if(!dateStr || !amount || amount <=0){

        return;
    }

    const stats =
        calculateStats(dateStr);

    let gov =
        Math.min(
            amount * .6,
            stats.dailyRemain,
            stats.monthlyRemain
        );

    if(gov < 0){

        gov = 0;
    }

    const tx = {

        id:Date.now(),

        date:dateStr,

        amount:amount,

        govPaid:gov,

        userPaid:amount - gov
    };

    saveTransaction(tx);

    document.getElementById(
        'amount-input'
    ).value = '';

    updateUI();
});

function deleteTransaction(id){

    if(!confirm('ลบรายการนี้ใช่หรือไม่?')){

        return;
    }

    let data =
        getTransactions();

    data =
        data.filter(tx=>tx.id !== id);

    localStorage.setItem(
        'gov_copay_ultra',
        JSON.stringify(data)
    );

    updateUI();
}

updateUI();

</script>

</body>
</html>
